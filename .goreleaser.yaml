version: 2
project_name: ubereats-pp-cli
changelog:
  disable: true
builds:
  - id: ubereats-pp-cli
    main: ./cmd/ubereats-pp-cli
    binary: ubereats-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X ubereats-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ubereats-pp-mcp
    main: ./cmd/ubereats-pp-mcp
    binary: ubereats-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ubereats-pp-cli
    repository:
      owner: amansk
      name: homebrew-tap
    homepage: "https://github.com/amansk/ubereats-pp-cli"
    description: "Your Uber Eats order history as a local database — spend, favourites, and search the app cannot answer."
    install: |
      bin.install "ubereats-pp-cli"
      bin.install "ubereats-pp-mcp"
